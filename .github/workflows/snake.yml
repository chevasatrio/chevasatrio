name: Update Profile Cards

on:
  schedule:
    - cron: "0 18 * * *"   # tiap hari jam 01:00 WIB (18:00 UTC)
  workflow_dispatch:

concurrency:
  group: update-profile-cards
  cancel-in-progress: true

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Siapkan fungsi fetch aman
        run: |
          mkdir -p assets
          cat << 'EOF' > fetch_safe.sh
          #!/bin/bash
          # Usage: ./fetch_safe.sh "<url>" "<output_file>" "<nama_kartu>"
          URL="$1"; OUT="$2"; LABEL="$3"
          MAX_RETRY=4; SLEEP=20

          for i in $(seq 1 $MAX_RETRY); do
            CODE=$(curl -sL --max-time 60 -A "Mozilla/5.0 (profile-readme-updater)" \
              -w "%{http_code}" "$URL" -o "$OUT.tmp")

            if [ "$CODE" != "200" ]; then
              echo "⚠️  [$LABEL] percobaan $i: HTTP $CODE."
            elif [ ! -s "$OUT.tmp" ]; then
              echo "⚠️  [$LABEL] percobaan $i: respons kosong."
            elif ! grep -q "<svg" "$OUT.tmp"; then
              echo "⚠️  [$LABEL] percobaan $i: bukan SVG valid."
            elif grep -qiE "something went wrong|rate limit|failed to retrieve|api issue|deploy own instance|not found" "$OUT.tmp"; then
              echo "⚠️  [$LABEL] percobaan $i: server mengembalikan kartu error."
            else
              mv "$OUT.tmp" "$OUT"
              echo "✅ [$LABEL] berhasil diambil."
              exit 0
            fi
            [ "$i" -lt "$MAX_RETRY" ] && sleep $SLEEP
          done

          echo "❌ [$LABEL] gagal setelah $MAX_RETRY percobaan. File lama dipertahankan."
          rm -f "$OUT.tmp"
          exit 1
          EOF
          chmod +x fetch_safe.sh

      # Hapus kartu error lama yang sempat ter-commit, supaya tidak dianggap "file lama yang valid"
      - name: Bersihkan kartu error lama
        run: |
          for f in assets/*.svg; do
            if grep -qiE "something went wrong|failed to retrieve|rate limit" "$f"; then
              echo "🧹 hapus $f (isinya halaman error)"
              rm -f "$f"
            fi
          done

      # continue-on-error: satu API gagal TIDAK menghentikan step lain maupun auto-commit
      - name: Activity Graph
        continue-on-error: true
        run: |
          ./fetch_safe.sh \
            "https://github-readme-activity-graph.vercel.app/graph?username=chevasatrio&theme=github-compact&bg_color=0D1117&color=FF2C2C&line=FF2C2C&point=FFFFFF&area=true&area_color=FF2C2C&hide_border=true&custom_title=Contribution%20Graph" \
            "assets/activity-graph.svg" "Activity Graph"

      - name: Trophy
        continue-on-error: true
        run: |
          ./fetch_safe.sh \
            "https://github-trophies.vercel.app/?username=chevasatrio&theme=darkhub&no-frame=true&no-bg=true&margin-w=8&column=7" \
            "assets/trophy.svg" "Trophy"

      - name: Streak
        continue-on-error: true
        run: |
          ./fetch_safe.sh \
            "https://streak-stats.demolab.com?user=chevasatrio&theme=github-dark-blue&hide_border=true&background=0D1117&ring=FF2C2C&fire=FF2C2C&currStreakLabel=FF2C2C&locale=id&short_numbers=true&mode=weekly" \
            "assets/streak.svg" "Streak"

      # always(): tetap commit apa pun hasil step di atas
      - name: Commit & push jika ada perubahan
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update profile cards [automated]"
          file_pattern: "assets/*.svg"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"

  update-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: chevasatrio
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push ke branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
