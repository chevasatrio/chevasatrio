name: Update Profile Cards

on:
  schedule:
    - cron: "0 18 * * *"   # tiap hari jam 01:00 WIB (18:00 UTC)
  workflow_dispatch:        

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Buat folder assets
        run: mkdir -p assets
      - name: Setup fungsi fetch aman
        run: |
          cat << 'EOF' > fetch_safe.sh
          #!/bin/bash
          # Usage: ./fetch_safe.sh "<url>" "<output_file>" "<nama_kartu>"
          URL="$1"
          OUT="$2"
          LABEL="$3"
          MAX_RETRY=4
          SLEEP=15

          for i in $(seq 1 $MAX_RETRY); do
            curl -sL "$URL" -o "$OUT.tmp"

            if [ ! -s "$OUT.tmp" ]; then
              echo "⚠️  [$LABEL] percobaan $i: respons kosong."
            elif ! grep -q "<svg" "$OUT.tmp"; then
              echo "⚠️  [$LABEL] percobaan $i: bukan SVG valid."
            elif grep -qiE "something went wrong|rate limit|failed to retrieve|sorry.*error|api issue" "$OUT.tmp"; then
              echo "⚠️  [$LABEL] percobaan $i: server mengembalikan halaman error (rate limit)."
            else
              mv "$OUT.tmp" "$OUT"
              echo "✅ [$LABEL] berhasil diambil."
              exit 0
            fi

            if [ "$i" -lt "$MAX_RETRY" ]; then
              echo "   menunggu ${SLEEP}s sebelum coba lagi..."
              sleep $SLEEP
            fi
          done

          echo "❌ [$LABEL] gagal setelah $MAX_RETRY percobaan. File lama TIDAK ditimpa."
          rm -f "$OUT.tmp"
          exit 1
          EOF
          chmod +x fetch_safe.sh

      - name: Ambil kartu Stats
        run: |
          ./fetch_safe.sh \
            "https://github-readme-stats-ivory-one-kzkgvaned5.vercel.app/api?username=chevasatrio&theme=github_dark_dimmed&rank_icon=github&show_icons=true&hide_border=true&bg_color=0D1117&title_color=FF2C2C&icon_color=FF2C2C&text_color=E6EDF3" \
            "assets/stats.svg" "Stats"

      - name: Ambil kartu Top Languages
        run: |
          ./fetch_safe.sh \
            "https://github-readme-stats-ivory-one-kzkgvaned5.vercel.app/api/top-langs/?username=chevasatrio&layout=compact&theme=github_dark_dimmed&hide_border=true&bg_color=0D1117&title_color=FF2C2C&text_color=E6EDF3&exclude_repo=github-readme-stats,chevasatrio.github.io&cache_seconds=1&_=$(date +%s)" \
            "assets/top-langs.svg" "Top Languages"

      - name: Ambil kartu Trophy
        run: |
          ./fetch_safe.sh \
            "https://github-trophies.vercel.app/?username=chevasatrio&theme=darkhub&no-frame=true&no-bg=true&margin-w=8&column=7" \
            "assets/trophy.svg" "Trophy"

      - name: Ambil Activity Graph
        run: |
          ./fetch_safe.sh \
            "https://github-readme-activity-graph.vercel.app/graph?username=chevasatrio&theme=github-dark&bg_color=0D1117&color=FF2C2C&line=FF2C2C&point=ffffff&hide_border=true" \
            "assets/activity-graph.svg" "Activity Graph"

      - name: Ambil kartu Streak
        run: |
          ./fetch_safe.sh \
            "https://streak-stats.demolab.com?user=chevasatrio&theme=github-dark-blue&hide_border=true&background=0D1117&ring=FF2C2C&fire=FF2C2C&currStreakLabel=FF2C2C&locale=id&short_numbers=true&mode=weekly" \
            "assets/streak.svg" "Streak"

      - name: Commit & push jika ada perubahan
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update stats cards [automated]"
          file_pattern: "assets/*.svg"

  update-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: chevasatrio
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push ke branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
